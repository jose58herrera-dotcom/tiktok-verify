<!DOCTYPE html>
  <html lang="es">
  <head>
  <meta charset="UTF-8">
  <title>TikTok OAuth Callback</title>
</head>
<body style="font-family: sans-serif; padding: 40px;">
<h1>TikTok authorization code</h1>
<p>Copy the code value below and send it back in chat:</p>
  <pre id="code" style="background:#eee; padding:15px; font-size:18px;"></pre>
  <p id="raw"></p>
  <script>
  var params = new URLSearchParams(window.location.search);
var code = params.get('code');
var error = params.get('error');
document.getElementById('code').textContent = code ? code : '(no code found)';
document.getElementById('raw').textContent = error ? ('error: ' + error) : window.location.href;
</script>
  </body>
  </html>
