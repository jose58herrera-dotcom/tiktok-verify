name: TikTok Publish
on:
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Call TikTok Content Posting API
        env:
          TIKTOK_ACCESS_TOKEN: ${{ secrets.TIKTOK_ACCESS_TOKEN }}
        run: |
          curl -sS -X POST "https://open.tiktokapis.com/v2/post/publish/content/init/" \
            -H "Authorization: Bearer $TIKTOK_ACCESS_TOKEN" \
            -H "Content-Type: application/json; charset=UTF-8" \
            -d '{
              "post_info": {
                "title": "📍 Angkor Wat, Siem Reap 🇰🇭",
                "description": "#expectationvreality #expectationvsreality #expectativavsrealidad #angkorwat #siemreap"
              },
              "source_info": {
                "source": "PULL_FROM_URL",
                "photo_cover_index": 0,
                "photo_images": [
                  "https://jose58herrera-dotcom.github.io/tiktok-verify/angkorwat_01.jpg",
                  "https://jose58herrera-dotcom.github.io/tiktok-verify/angkorwat_02.jpg",
                  "https://jose58herrera-dotcom.github.io/tiktok-verify/angkorwat_03.jpg",
                  "https://jose58herrera-dotcom.github.io/tiktok-verify/angkorwat_04.jpg",
                  "https://jose58herrera-dotcom.github.io/tiktok-verify/angkorwat_05.jpg"
                ]
              },
              "post_mode": "MEDIA_UPLOAD",
              "media_type": "PHOTO"
            }' -o response.json -w "\nHTTP_STATUS:%{http_code}\n"
          echo "--- Response ---"
          cat response.json
