name: TikTok Publish
on:
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Call TikTok Content Posting API and check status
        env:
          TIKTOK_ACCESS_TOKEN: ${{ secrets.TIKTOK_ACCESS_TOKEN }}
        run: |
          curl -sS -X POST "https://open.tiktokapis.com/v2/post/publish/content/init/" \
            -H "Authorization: Bearer $TIKTOK_ACCESS_TOKEN" \
            -H "Content-Type: application/json; charset=UTF-8" \
            -d '{
              "post_info": {
                "title": "📍 Pub Street, Siem Reap 🇰🇭",
                "description": "#expectationvreality #expectationvsreality #expectativavsrealidad #pubstreet #siemreap"
              },
              "source_info": {
                "source": "PULL_FROM_URL",
                "photo_cover_index": 0,
                "photo_images": [
                  "https://jose58herrera-dotcom.github.io/tiktok-verify/pubstreet_01.jpg",
                  "https://jose58herrera-dotcom.github.io/tiktok-verify/pubstreet_02.jpg",
                  "https://jose58herrera-dotcom.github.io/tiktok-verify/pubstreet_03.jpg",
                  "https://jose58herrera-dotcom.github.io/tiktok-verify/pubstreet_04.jpg"
                ]
              },
              "post_mode": "MEDIA_UPLOAD",
              "media_type": "PHOTO"
            }' -o response.json -w "\nHTTP_STATUS:%{http_code}\n"
          echo "--- Init Response ---"
          cat response.json
          PID=$(python3 -c "import json; print(json.load(open('response.json'))['data']['publish_id'])")
          echo "publish_id=$PID"
          echo "Waiting 8s before status check..."
          sleep 8
          echo "--- Status Check ---"
          curl -sS -X POST "https://open.tiktokapis.com/v2/post/publish/status/fetch/" \
            -H "Authorization: Bearer $TIKTOK_ACCESS_TOKEN" \
            -H "Content-Type: application/json; charset=UTF-8" \
            -d "{\"publish_id\": \"$PID\"}" \
            -w "\nHTTP_STATUS:%{http_code}\n"
